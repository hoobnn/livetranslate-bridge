name: CI

# 单元测试。推送 main、PR 时运行；release.yml 发版前也调用它。
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 同一分支上新的推送取消旧的运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 工程为 Xcode 27 格式且依赖 macOS 27 API，只能跑在 xcode-27 镜像上。
  test:
    name: Test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 🧪 Unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project LiveTranslateBridge.xcodeproj \
            -scheme LiveTranslateBridge \
            -destination 'platform=macOS' \
            -only-testing:LiveTranslateBridgeTests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
