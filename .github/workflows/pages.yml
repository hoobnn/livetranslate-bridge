name: pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:
  # release.yml 发版后调用，更新 appcast.xml。
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp site/* _site/
          cp docs/assets/product/app-subtitles-light.jpg docs/assets/product/app-subtitles-dark.jpg docs/assets/product/social-preview.jpg _site/
          cp LiveTranslateBridge/Assets.xcassets/AppIcon.appiconset/AppIcon-256.png _site/icon.png
          version=$(gh release view --json tagName --jq '.tagName | ltrimstr("v")')
          sed -i "s/__VERSION__/${version}/g" _site/index.html
      # Sparkle 的更新源，从 GitHub Releases 生成，不进版本库。
      - uses: hoobnn/ci-workflows/.github/actions/sparkle-appcast@v1
        with:
          output: _site/appcast.xml
          artifact-basename: LiveTranslateBridge
          title: LiveTranslate Bridge
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
